name: 自动化打包vue项目并部署到 sb6657.cn

on:
  workflow_dispatch:

  push:
    branches:
      - main
      - master
    paths-ignore:
      - '**.md'  # 忽略文档修改
      - 'docs/**'
      - 'README*'

# 当前仓库只需要读取源码。
# 向 Pages 仓库写入使用 GitHub App 临时令牌。
permissions:
  contents: read

# 避免多个部署任务同时修改部署仓库。
concurrency:
  group: deploy-sb6657-cn-pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    name: 构建并部署
    runs-on: ubuntu-latest

    steps:
      - name: 读取主源码仓库
        uses: actions/checkout@v6
        with:
          fetch-depth: 0  # 获取完整历史（可选，用于生成版本信息）

      - name: 设置 pnpm
        uses: pnpm/action-setup@v6

      - name: 设置 Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22.x'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 检查代码规范
        run: pnpm run lint

      - name: 检查 TypeScript 类型
        run: pnpm run typecheck

      - name: 打包项目
        run: pnpm run build

      - name: 检查打包输出
        run: ls -la ./dist  # 如果输出目录是 dist，可以用此步骤确认打包文件

      # 放在构建完成之后再生成令牌，
      # 尽量减少临时令牌的有效时间窗口。
      - name: 创建 GitHub App 临时令牌
        id: pages-app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.PAGES_APP_CLIENT_ID }}
          private-key: ${{ secrets.PAGES_APP_PRIVATE_KEY }}
          owner: sb6657-cn
          repositories: sb6657-cn.github.io
          permission-contents: write

      - name: 读取 GitHub Pages 部署仓库
        uses: actions/checkout@v6
        with:
          repository: sb6657-cn/sb6657-cn.github.io
          ref: main
          path: pages-repo
          token: ${{ steps.pages-app-token.outputs.token }}

      - name: 更新部署文件
        run: |
          # 延续原有部署策略：
          # 清除旧 assets，但保留 CNAME、404.html、README、merge-pig 以及其他手工维护文件。
          rm -rf pages-repo/assets/

          # 把 dist 的全部内容（包括可能存在的隐藏文件）复制过去。
          cp -a dist/. pages-repo/

      - name: 获取 GitHub App Bot 身份
        id: pages-app-user
        env:
          GH_TOKEN: ${{ steps.pages-app-token.outputs.token }}
        run: |
          APP_LOGIN="${{ steps.pages-app-token.outputs.app-slug }}[bot]"
          APP_USER_ID="$(gh api "/users/${APP_LOGIN}" --jq '.id')"

          echo "login=${APP_LOGIN}" >> "$GITHUB_OUTPUT"
          echo "user-id=${APP_USER_ID}" >> "$GITHUB_OUTPUT"

      - name: 提交并推送部署结果
        working-directory: pages-repo
        env:
          APP_LOGIN: ${{ steps.pages-app-user.outputs.login }}
          APP_USER_ID: ${{ steps.pages-app-user.outputs.user-id }}
        run: |
          git config user.name "${APP_LOGIN}"
          git config user.email \
            "${APP_USER_ID}+${APP_LOGIN}@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "构建产物没有变化，无需提交。"
            exit 0
          fi

          git commit -m "自动部署: ${GITHUB_SHA}"
          git push origin HEAD:main
